name: Build Disco Sauce 2 Pro
on:
  push:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -A x64
      - name: Build tests + plugin
        run: cmake --build build --config Release --parallel
      - name: Run DSP tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Collect VST3
        shell: bash
        run: |
          mkdir -p out
          cp -r "build/DiscoSaucePro_artefacts/Release/VST3/Disco Sauce 2 Pro.vst3" out/
          cp -r "build/DiscoSaucePro_artefacts/Release/Standalone" out/ || true
      - uses: actions/upload-artifact@v4
        with:
          name: Disco-Sauce-2-Pro-Windows
          path: out
